name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core dependencies
        run: pip install -r requirements.txt
      - name: Install optional dependencies (best-effort)
        run: pip install boto3 langgraph || true
      - name: Lint
        run: ruff check src tests
      - name: Generate sample + run full pipeline
        run: |
          python scripts/generate_sample.py
          python -m sentinel.train
          python -m sentinel.evaluate
          python -m sentinel.risk_quant.quant_report
          python -m sentinel.copilot.demo
        env:
          PYTHONPATH: src
      - name: Tests
        run: pytest --cov=src/sentinel
        env:
          PYTHONPATH: src
